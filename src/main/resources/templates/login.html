<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In — UPS Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: #f5f0e8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      color: #2c2416;
    }

    .card {
      background: #fdfaf5;
      border: 1px solid #e8dfd0;
      border-radius: 20px;
      box-shadow: 0 2px 12px rgba(100,70,30,0.07), 0 8px 32px rgba(100,70,30,0.05);
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.6rem;
      font-weight: 400;
      color: #2c2416;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      font-size: 0.875rem;
      color: #9c8b78;
      margin-bottom: 2.25rem;
    }

    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      width: 100%;
      padding: 0.78rem 1rem;
      background: #7c5c38;
      color: #fdf8f2;
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      font-family: 'DM Sans', system-ui, sans-serif;
      font-weight: 600;
      letter-spacing: 0.3px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.22s, box-shadow 0.22s, transform 0.1s;
      box-shadow: 0 2px 8px rgba(124,92,56,0.18);
    }

    .btn-google:hover {
      background: #6b4e2f;
      box-shadow: 0 4px 16px rgba(124,92,56,0.28);
      transform: translateY(-1px);
    }

    .btn-google:active {
      transform: translateY(0) scale(0.99);
    }

    .btn-google svg { flex-shrink: 0; }

    .divider {
      border: none;
      border-top: 1px solid #ede5d8;
      margin: 2rem 0 1.25rem;
    }

    .note {
      font-size: 0.78rem;
      color: #b8a898;
    }

    .alert {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      border-radius: 8px;
      padding: 0.65rem 0.9rem;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
    }
  </style>
</head>
<body>
<div class="card">

  <h1>UPS Generator</h1>
  <p class="subtitle">Sign in to access the application</p>

  <div th:if="${param.logout}" class="alert" style="background:#f0fdf4;border-color:#bbf7d0;color:#15803d;">
    You have been signed out successfully.
  </div>
  <div th:if="${param.error}" class="alert">
    Authentication failed. Please try again.
  </div>

  <a href="/oauth2/authorization/google" class="btn-google">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#fff" fill-opacity=".9"/>
      <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#fff" fill-opacity=".75"/>
      <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#fff" fill-opacity=".6"/>
      <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#fff" fill-opacity=".85"/>
    </svg>
    Sign in with Google
  </a>

  <hr class="divider"/>
  <p class="note">Access is restricted to authorized users only.</p>
</div>
</body>
</html>
